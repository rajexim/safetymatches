-09 to BX-15 with metallic gold foil stamping & black splints)."}},{"@type":"Question","name":"Does Glovel Matches LLP make anything besides safety matches?","acceptedAnswer":{"@type":"Answer","text":"Yes. Glovel Matches LLP is part of the Glovel Group of Companies, which also manufactures and exports incense sticks and incense cones from our Tamil Nadu facilities. This site (safetymatches.in) covers our safety matches catalogue and specifications in full; our incense product range is presented at glovel.in."}},{"@type":"Question","name":"Why are Glovel wax safety matches ideal for tropical and high-humidity climates?","acceptedAnswer":{"@type":"Answer","text":"Our wax matches feature premium kraft paper splints thoroughly impregnated with refined paraffin wax and chemical strike heads treated for moisture resistance. Unlike standard paper matches that soften in humid sea air, Glovel wax matches maintain rigidity and ignite smoothly even in coastal, rainy, or tropical environments across Africa, Latin America, and island nations."}},{"@type":"Question","name":"What is the Minimum Order Quantity (MOQ) for international container shipments?","acceptedAnswer":{"@type":"Answer","text":"For standard wooden and wax safety matches, our standard export MOQ is 1 x 20FT FCL (Full Container Load), which typically holds 1,000 to 1,850 master cartons depending on matchbox size. For specialized promotional hotel matches and kitchen matchboxes, custom OEM runs start at 500 outer cartons or 10,000 custom units."}},{"@type":"Question","name":"Can we customize the matchbox artwork, striker friction, and match head colors?","acceptedAnswer":{"@type":"Answer","text":"Yes, 100%. Glovel Matches LLP provides complete OEM private label manufacturing. Importers can customize cover board artwork (4-color wet offset printing, metallic gold/silver foil, spot UV), side striker coating (plain or dotted friction), splint material (natural poplar wood, paraffin kraft, or black dyed wood), and match head colors (red, black, brown, green, pink, or custom hex shades)."}},{"@type":"Question","name":"Which sea port is used for ocean freight dispatch from Sivakasi?","acceptedAnswer":{"@type":"Answer","text":"All international FCL container shipments are dispatched from V.O. Chidambaranar Port (Tuticorin VOC Port), located just 90 km from our Sivakasi manufacturing plant. This close proximity ensures rapid port stuffing, reduced inland transit times, and quick bill of lading (B/L) issuance."}},{"@type":"Question","name":"What quality certifications and chemical compliance standards do your matches meet?","acceptedAnswer":{"@type":"Answer","text":"Glovel Matches LLP is ISO 9001:2015 certified and a registered member of CAPEXIL (Chemicals and Allied Products Export Promotion Council, Govt. of India). Our matchsticks strictly adhere to Bureau of Indian Standards (IS 2653) and European REACH chemical safety regulations—ensuring zero afterglow, lead-free composition, and non-toxic combustion."}},{"@type":"Question","name":"How are matches packed to prevent damage during long ocean voyages?","acceptedAnswer":{"@type":"Answer","text":"Safety matches are packed in multi-tier moisture-barrier packaging. Matchboxes are first bundled into polypacks or caddy boxes, wrapped in heavy-duty shrink film, and packed into 3-ply or 5-ply corrugated master cartons. Outer cartons are palletized and container-sealed to resist dampness during sea transit."}},{"@type":"Question","name":"How can international buyers request physical sample kits and factory price quotes?","acceptedAnswer":{"@type":"Answer","text":"You can request a free physical sample kit and CIF/FOB pricing by contacting our export desk directly via email at sales@glovel.in, WhatsApp at +91 99525 38046, or phone at +91 99525 38046. Sample boxes can be shipped via express courier to your destination address."}}]}]}</script>
