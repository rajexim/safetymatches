# Glovel Matches LLP — nginx server block
#
# Install as /etc/nginx/sites-available/glovel, then:
#   ln -s /etc/nginx/sites-available/glovel /etc/nginx/sites-enabled/glovel
#   nginx -t && systemctl reload nginx
#
# Replace safetymatches.in with your domain and /var/www/html/glovel if you used a
# different path.

server {
    listen 80;
    listen [::]:80;
    server_name safetymatches.in www.safetymatches.in;

    # Canonical host is www (matches SITE_URL / sitemap / JSON-LD).
    if ($host = safetymatches.in) {
        return 301 https://www.safetymatches.in$request_uri;
    }

    # certbot rewrites this block to redirect to HTTPS. Until then, serving on
    # 80 is fine.
    root /var/www/html/glovel/dist;
    index index.html;

    # ---------------------------------------------------------------------
    # Routing — the single most important block for SEO
    # ---------------------------------------------------------------------
    # `npm run build` writes a prerendered <route>/index.html for all twelve
    # pages, each with its own title, description, canonical and JSON-LD. The
    # usual SPA rule (rewrite everything straight to /index.html) would hide
    # those files and serve the homepage's tags on every URL. Order matters:
    # real file, then the route's index.html, then the SPA fallback.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # ---------------------------------------------------------------------
    # Static content and images
    # ---------------------------------------------------------------------
    # /content/site-content.json and product images live in public/ so a rebuild
    # is not required to serve them. This is not a live CMS.
    #
    # Note this cannot be a blanket /assets/ alias: the Vite JS and CSS bundles
    # also live under /assets/, and only /assets/images/ comes from public/.
    location ^~ /assets/images/ {
        alias /var/www/html/glovel/public/assets/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /content/ {
        alias /var/www/html/glovel/public/content/;
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    # ---------------------------------------------------------------------
    # Caching
    # ---------------------------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached forever.
    location ~* ^/assets/.+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML must not be cached hard, or SEO/content edits will not go live.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; }
    location = /robots.txt  {
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location = /llms.txt    {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
    location ~ "^/llms-[a-z]{2}\.txt$" {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
    location = /schema.json {
        default_type application/ld+json;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # Hardening
    # ---------------------------------------------------------------------
    # Blocks .htaccess (shipped for Apache hosts and meaningless here), .git,
    # and any other dotfile.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
    # WebP, PNG and JPEG are already compressed — gzipping them wastes CPU.

    access_log /var/log/nginx/glovel.access.log;
    error_log  /var/log/nginx/glovel.error.log;
}
