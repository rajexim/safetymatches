rbecue et cheminée (BBQ 96, 170, 280 - bâtonnets bois tendre épais jusqu’à 280 mm) • Carnets promotionnels et hôteliers personnalisés (BX-09 à BX-15 avec dorure or métallique et tiges noires)."}},{"@type":"Question","name":"Pourquoi les allumettes cire Glovel sont-elles idéales pour les climats tropicaux et très humides ?","acceptedAnswer":{"@type":"Answer","text":"Nos allumettes cire sont dotées de tiges en papier kraft premium soigneusement imprégnées de paraffine raffinée et de têtes chimiques traitées pour la résistance à l’humidité. Contrairement aux allumettes papier standard qui se ramollissent dans l’air marin humide, les allumettes cire Glovel conservent leur rigidité et s’allument facilement même dans les environnements côtiers, pluvieux ou tropicaux d’Afrique, d’Amérique latine et des nations insulaires."}},{"@type":"Question","name":"Quelle est la quantité minimale de commande (MOQ) pour les expéditions internationales en conteneur ?","acceptedAnswer":{"@type":"Answer","text":"Pour les allumettes de sûreté standard en bois et en cire, notre MOQ export standard est de 1 × 20FT FCL (Full Container Load), qui contient généralement 1 000 à 1 850 cartons maîtres selon la taille de la boîte. Pour les allumettes hôtelières promotionnelles spécialisées et les boîtes cuisine, les séries OEM personnalisées démarrent à 500 cartons extérieurs ou 10 000 unités personnalisées."}},{"@type":"Question","name":"Pouvons-nous personnaliser l’artwork de la boîte, le frottement du frottoir et les couleurs des têtes ?","acceptedAnswer":{"@type":"Answer","text":"Oui, à 100 %. Glovel Matches LLP assure une fabrication OEM marque privée complète. Les importateurs peuvent personnaliser l’artwork du couvercle (impression offset 4 couleurs, dorure or/argent, spot UV), le revêtement du frottoir latéral (friction plain ou pointillée), le matériau de la tige (peuplier naturel, kraft paraffinisé ou bois teint noir) et les couleurs de tête (rouge, noir, brun, vert, rose ou teintes hex personnalisées)."}},{"@type":"Question","name":"Quel port maritime est utilisé pour l’expédition océanique depuis Sivakasi ?","acceptedAnswer":{"@type":"Answer","text":"Toutes les expéditions internationales en conteneur FCL partent du port V.O. Chidambaranar (port Tuticorin VOC), situé à seulement 90 km de notre usine de Sivakasi. Cette proximité assure un stuffing portuaire rapide, des délais de transit intérieur réduits et une émission rapide du connaissement (B/L)."}},{"@type":"Question","name":"Quelles certifications qualité et normes de conformité chimique vos allumettes respectent-elles ?","acceptedAnswer":{"@type":"Answer","text":"Glovel Matches LLP est certifiée ISO 9001:2015 et membre enregistré de CAPEXIL (Chemicals and Allied Products Export Promotion Council, Govt. of India). Nos allumettes respectent strictement les normes Bureau of Indian Standards (IS 2653) et les réglementations européennes REACH — garantissant zéro afterglow, composition sans plomb et combustion non toxique."}},{"@type":"Question","name":"Comment les allumettes sont-elles emballées pour éviter les dommages lors des longs trajets océaniques ?","acceptedAnswer":{"@type":"Answer","text":"Les allumettes de sûreté sont emballées en emballage multi-niveaux à barrière d’humidité. Les boîtes sont d’abord regroupées en polypacks ou caddy boxes, enveloppées de film rétractable haute résistance, puis emballées dans des cartons maîtres ondulés 3 ou 5 plis. Les cartons extérieurs sont palettisés et scellés en conteneur pour résister à l’humidité pendant le transit maritime."}},{"@type":"Question","name":"Comment les acheteurs internationaux peuvent-ils demander des kits d’échantillons physiques et des devis usine ?","acceptedAnswer":{"@type":"Answer","text":"Vous pouvez demander un kit d’échantillons physiques gratuit et un tarif CIF/FOB en contactant directement notre service export par e-mail à sales@glovel.in, WhatsApp au +91 99525 38046, ou téléphone au +91 99525 38046. Les boîtes d’échantillons peuvent être expédiées par coursier express à votre adresse de destination."}}]}]}</script>
